name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag-ul release-ului existent la care se atașează fișierele"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        if: matrix.rid == 'linux-x64'
        run: dotnet test ErpNet.FP.Core.Tests/ErpNet.FP.Core.Tests.csproj -c Release
      - name: Publish
        run: dotnet publish ErpNet.FP.Server/ErpNet.FP.Server.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o out/${{ matrix.rid }}
      - name: Add docs and test script
        shell: bash
        run: |
          cp README.md README-RO.md out/${{ matrix.rid }}/
          mkdir -p out/${{ matrix.rid }}/tools
          cp tools/test-ro.ps1 out/${{ matrix.rid }}/tools/
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath ErpNet.FP-RO-${{ github.event.release.tag_name || inputs.tag }}-${{ matrix.rid }}.zip
      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: cd out/${{ matrix.rid }} && zip -qr ../../ErpNet.FP-RO-${{ github.event.release.tag_name || inputs.tag }}-${{ matrix.rid }}.zip .
      - name: Build setup.exe (Inno Setup)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=${{ github.event.release.tag_name || inputs.tag }}" "/DPublishDir=..\out\win-x64" installer\ErpNet.FP-RO.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\*.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.rid }}
          path: |
            ErpNet.FP-RO-*.zip
            ErpNet.FP-RO-*-setup.exe

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/* --clobber -R "${{ github.repository }}"
